name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app.py analysis data tests smoke_test.py generate_openapi_files.py

      - name: Pytest
        run: python -m pytest -q

      - name: Smoke test
        run: python smoke_test.py

      - name: Verify OpenAPI
        run: python generate_openapi_files.py

      - name: Verify generated OpenAPI is committed
        run: git diff --exit-code -- ourplaneteanalyzing_full_openapi.json ourplaneteanalyzing_full_openapi.yaml
